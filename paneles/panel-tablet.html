<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panel de la casa</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --text:#eaf0ff; --muted:#a9b8d9; --green:#7ee2a8; --blue:#6aa8ff; --amber:#f5c26b; --red:#ff7a7a;
  --card:rgba(255,255,255,0.06); --line:rgba(255,255,255,0.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1330;color:var(--text);font-family:'Outfit',Roboto,'Segoe UI',Arial,sans-serif;touch-action:pan-y}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;text-align:left}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;padding:24px 28px;
  background:linear-gradient(160deg,#0a1330 0%,#10224a 55%,#0d1b3d 100%);overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px}
svg.m{fill:currentColor;stroke:none}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
/* cabecera */
#header{display:grid;grid-template-columns:285px 1fr 300px;gap:20px;height:100px}
#clock{padding:0 22px;display:flex;flex-direction:column;justify-content:center}
#clock .t{font-size:68px;font-weight:300;letter-spacing:-1px;line-height:1}
#clock .d{margin-top:4px;font-size:20px;color:var(--muted)}
#people{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.person{display:flex;align-items:center;gap:10px;margin-right:8px}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500}
.person .n{font-size:17px;font-weight:500}
.person .s{font-size:15px;color:var(--muted);white-space:nowrap} .person .s.on{color:var(--green)}
.pill{white-space:nowrap;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,0.08);font-size:15px}
.pill.ok{color:var(--green)} .pill.warn{color:var(--amber)} .pill.bad{color:var(--red)}
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 8px}
.navb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;border:1px solid transparent;font-size:12.5px;color:var(--muted);padding:0;min-width:0}
.navb.act{background:rgba(106,168,255,0.14);border-color:rgba(106,168,255,0.55);color:var(--text)}
.navb:active{background:rgba(255,255,255,0.12)}
/* pantallas */
#viewport{margin-top:20px;height:632px;width:1224px;overflow:hidden}
#track{display:flex;width:4896px;height:100%;transition:transform .35s ease}
.screen{width:1224px;height:100%;flex:none;padding-right:0}
.pad{padding:22px 24px}
.ct{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;margin-bottom:14px}
.lbl{font-size:16px;color:var(--muted)}
/* inicio */
.s1{display:grid;grid-template-columns:420px 1fr;grid-template-rows:296px 1fr;gap:20px;height:100%}
.now{display:flex;flex-direction:column;padding:16px 26px}
.now .row{display:flex;align-items:center;gap:18px;margin-top:6px}
.now .temp{font-size:84px;font-weight:300;line-height:1;letter-spacing:-2px}
.now .cond{font-size:26px;margin-top:6px}
.now .mm{font-size:17px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:20px}
.stat{padding:14px 20px;display:flex;flex-direction:column;justify-content:space-between}
.stat .top{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--muted)}
.stat .v{font-size:42px;font-weight:300;line-height:1.05}
.stat .v small{font-size:20px;color:var(--muted);margin-left:4px}
.stat .v.sm{font-size:31px;white-space:nowrap}
.stat .sub{font-size:16px;color:var(--muted);min-height:20px}
.fc{grid-column:1/3;padding:12px 22px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.fc .ct{margin:0 0 4px}
.hours,.days{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr;gap:8px;flex:1;min-height:0}
.hr{background:rgba(255,255,255,0.05);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px;min-height:0}
.hr .hn{font-size:16px;color:var(--muted)} .hr .ht{font-size:24px} .hr .ht small{font-size:16px;color:var(--muted)} .hr .ht .lo2{color:var(--muted)} .hr .hp{font-size:13px;color:var(--blue);min-height:15px}
.day .dn{font-size:18px;font-weight:500}
.day .hi{font-size:26px} .day .lo{font-size:17px;color:var(--muted)} .day .pr{font-size:15px;color:var(--blue)}
/* casa */
.s2{display:grid;grid-template-columns:1fr 360px;gap:20px;height:100%}
.col{display:flex;flex-direction:column;gap:20px;min-height:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px;flex:1}
.tile{border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text)}
.tile:active{background:rgba(255,255,255,0.16)}
.tile .nm{font-size:19px;font-weight:500}
.tile .stt{font-size:16px;color:var(--muted)}
.tile.on{background:rgba(245,194,107,0.14);border-color:rgba(245,194,107,0.6)}
.tile.on .stt{color:var(--amber)}
.tile.cool{background:rgba(106,168,255,0.16);border-color:rgba(106,168,255,0.6)}
.tile.heat{background:rgba(255,140,90,0.16);border-color:rgba(255,140,90,0.6)}
.tile.na{opacity:.45}
.row2{display:grid;grid-template-columns:1.8fr 1fr;gap:20px;height:240px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1} .pair.p3{grid-template-columns:repeat(3,1fr);gap:10px}
.climate{justify-content:space-between}
.climate .big{font-size:34px;font-weight:300}
.routine,.routine.tile{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;flex:1;padding:0 20px;border-radius:20px}
.routine .ic{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;flex:none}
.routine .nm{font-size:22px;font-weight:500}
.routine .stt{font-size:15px;color:var(--muted);margin-top:2px}
.routine.run{border-color:var(--blue);background:rgba(106,168,255,0.14)}
.routines{display:flex;flex-direction:column;gap:14px;flex:1}
/* seguridad */
.s3{display:grid;grid-template-columns:640px 1fr;gap:20px;height:100%}
.alm{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1}
.abtn{border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid var(--line);padding:14px 14px;display:flex;flex-direction:column;justify-content:space-between}
.abtn:active{background:rgba(255,255,255,0.16)}
.abtn .nm{font-size:20px;font-weight:500}
.abtn .stt{font-size:15px;color:var(--muted)}
.abtn.cur{background:rgba(126,226,168,0.13);border-color:rgba(126,226,168,0.6)}
.bignum{font-size:60px;font-weight:300;line-height:1}
.bignum small{font-size:26px;color:var(--muted);margin-left:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:19px}
.li span:first-child{color:var(--muted);font-size:17px}
.cam{display:flex;align-items:center;gap:20px;flex:1}
.cam .ic{width:74px;height:74px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(126,226,168,0.14);color:var(--green);flex:none}
.cam.alert .ic{background:rgba(255,122,122,0.18);color:var(--red)}
.cam .big{font-size:28px;font-weight:500}
/* detectores */
.dets{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px;flex:1;min-height:0}
.det{border-radius:18px;background:rgba(255,255,255,0.07);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
.det .nm{font-size:19px;font-weight:500} .det .stt{font-size:15px;color:var(--muted)}
.det.ok{background:rgba(126,226,168,0.12);border-color:rgba(126,226,168,0.55)} .det.ok .stt{color:var(--green)}
.det.alert{background:rgba(255,122,122,0.22);border-color:var(--red)} .det.alert .stt{color:var(--red);font-weight:500}
.det.pend{opacity:.5;border-style:dashed}
.det.na{background:rgba(245,194,107,0.12);border-color:rgba(245,194,107,0.55)} .det.na .stt{color:var(--amber)}
#alertbar{position:absolute;left:0;top:0;width:1280px;height:64px;display:none;align-items:center;justify-content:center;gap:14px;background:var(--red);color:#2a0a0a;font-size:28px;font-weight:600;z-index:35}
#alertbar.show{display:flex}

/* energia */
.s4{display:grid;grid-template-columns:1fr 372px;gap:20px;height:100%}
.s4 .col{gap:20px}
.estats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;height:150px}
.estats .stat{padding:14px 20px}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex:1;min-height:0;padding-top:6px}
.bcol{flex:1;min-width:0;max-width:96px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bval{font-size:15px;color:var(--text)}
.bars{width:100%;max-width:64px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px;overflow:hidden}
.seg{width:100%}
.seg.car{background:#f5a25b}
.seg.pay{background:#6aa8ff} .seg.sun{background:#7ee2a8} .seg.raw{background:#8da2cf} .seg.cur{background:#8da2cf;opacity:.5}
.blab{font-size:15px;color:var(--muted)}
.legend{display:flex;gap:18px;font-size:14px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:19px}
.kv span:first-child{color:var(--muted);font-size:16px}
.kv .g{color:var(--green)}
.note{font-size:14px;color:var(--muted);line-height:1.35;margin-top:auto;padding-top:8px}
/* modal, toast, avisos */
#modal{position:absolute;left:0;top:0;width:1280px;height:800px;background:rgba(5,10,25,0.72);display:none;align-items:center;justify-content:center;z-index:20}
#modal.show{display:flex}
#mbox{width:560px;padding:28px;background:#14264f;border:1px solid rgba(255,255,255,0.16);border-radius:24px}
#mbox h2{margin:0 0 10px;font-size:26px;font-weight:500}
#mbox p{margin:0 0 22px;font-size:18px;color:var(--muted);line-height:1.4}
.mbtns{display:flex;gap:14px}
.mbtn{flex:1;text-align:center;padding:16px;border-radius:16px;background:rgba(255,255,255,0.1);font-size:20px;font-weight:500}
.mbtn.go{background:rgba(106,168,255,0.28);border:1px solid rgba(106,168,255,0.7)}
.mbtn:active{background:rgba(255,255,255,0.22)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.modes .mbtn.cur{background:rgba(106,168,255,0.28);border:1px solid rgba(106,168,255,0.7)}
.tctl{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.tctl .mbtn{flex:none;width:96px;font-size:32px;padding:10px}
.tctl .tv{font-size:64px;font-weight:300}
#toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(20,38,79,0.96);border:1px solid rgba(255,255,255,0.18);padding:14px 22px;border-radius:999px;font-size:17px;display:none;z-index:30}
#dot{position:absolute;right:10px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--green);z-index:15;opacity:.0}
#dot.off{opacity:1;background:var(--red)}
#over{position:absolute;left:0;top:0;width:1280px;height:800px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(5,10,25,0.9);z-index:40;text-align:center}
#over.show{display:flex}
#over h2{margin:0;font-size:32px;font-weight:500}
#over p{margin:0;color:var(--muted);font-size:19px;max-width:700px;line-height:1.4}
#over a{display:inline-block;margin-top:8px;padding:16px 28px;border-radius:16px;background:rgba(106,168,255,0.28);border:1px solid rgba(106,168,255,0.7);color:var(--text);font-size:20px;text-decoration:none}
</style>
</head>
<body>
<div id="stage">
  <div id="dot"></div>
  <div id="header">
    <div id="clock" class="card"></div>
    <div id="people" class="card"></div>
    <div id="nav" class="card"></div>
  </div>
  <div id="viewport"><div id="track">
    <div class="screen" id="sc0"></div>
    <div class="screen" id="sc1"></div>
    <div class="screen" id="sc2"></div>
    <div class="screen" id="sc3"></div>
  </div></div>
  <div id="modal"><div id="mbox"></div></div>
  <div id="toast"></div>
  <div id="over"></div>
  <div id="alertbar"></div>
</div>

<script>
(function(){
'use strict';
/* =====================================================================
   CONFIGURACIÓN: cambia estos identificadores por los de TU casa.
   Los encontrarás en Configuración → Herramientas para desarrolladores (pestaña Estados).
   Todos los nombres y datos de este archivo son de EJEMPLO.
   ===================================================================== */
var E = {
  weather:'weather.casa', sun:'sun.sun',
  alarm:'alarm_control_panel.alarma_casa',
  camera:'binary_sensor.camara_persona',

  /* Energía: sensores de consumo y de la factura (adapta a tu integración). */

};
/* Facturas ya leídas (kWh medidos por el contador, kWh facturados, descuento de las placas, etc.).
   Si existe /local/panel/facturas.json, sustituye a esta lista. Una entrada por mes. */
/* Facturas de EJEMPLO (inventadas). */

  {p:'2026-05',medido:340,facturado:275,descuento_kwh:65,excedente_kwh:18,excedente_eur:0.9,ahorro_eur:10.6,total:56.80},
  {p:'2026-06',medido:520,facturado:455,descuento_kwh:65,excedente_kwh:12,excedente_eur:0.6,ahorro_eur:10.6,total:83.70},
  {p:'2026-07',medido:640,facturado:575,descuento_kwh:65,excedente_kwh:10,excedente_eur:0.5,ahorro_eur:10.6,total:104.20},
  {p:'2026-08',medido:600,facturado:530,descuento_kwh:70,excedente_kwh:25,excedente_eur:1.2,ahorro_eur:11.4,total:96.60},
  {p:'2026-09',medido:480,facturado:415,descuento_kwh:65,excedente_kwh:14,excedente_eur:0.7,ahorro_eur:10.6,total:78.90}
];
/* Consumo del coche eléctrico por mes, kWh (EJEMPLO). */
var CAR={'2026-01':40,'2026-02':38,'2026-03':45,'2026-04':42,'2026-05':50,'2026-06':55,'2026-07':60,'2026-08':58,'2026-09':48,'2026-10':30};
var CARY={2025:520};
var IDLE_RETURN_MS = 120000;   // vuelve a Inicio tras 2 min sin tocar (0 = desactivado)
var WATCH = [E.weather,E.sun,E.alarm,E.camera,E.tempCasa,E.humCasa,E.outTemp,E.outHum,E.outBat];
E.people.concat(E.lights,E.fans,E.climates).forEach(function(x){WATCH.push(x[1]);});
E.scripts.forEach(function(x){WATCH.push(x[1]);});
Object.keys(E.energy).forEach(function(k){WATCH.push(E.energy[k]);});
E.detectors.forEach(function(d){ if(d[1]) WATCH.push(d[1]); if(d[3]) WATCH.push(d[3]); });

/* ===== Iconos ===== */
/* Iconos: Material Design Icons (los mismos que usa Home Assistant) */
var P = {

function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; if(toastT) clearTimeout(toastT); toastT=setTimeout(function(){t.style.display='none';},3200); }
function renderClimateModal(){
  var id=modalCtx; if(!id) return; var s=st(id), tg=at(id,'temperature'), cur=at(id,'current_temperature'), modes=at(id,'hvac_modes')||['off','cool','heat'];
  var name='Aire'; E.climates.forEach(function(c){ if(c[1]===id) name=(c[2]||'Aire')+' · '+c[0]; });
  var h='<h2>'+name+'</h2><p>Temperatura actual: '+(isNum(cur)?fmt(cur)+'°':'sin datos')+'</p><div class="modes">';
  modes.forEach(function(m){ h+='<button class="mbtn'+(s===m?' cur':'')+'" data-act="hvac" data-mode="'+m+'">'+(HV[m]||m)+'</button>'; });
  h+='</div>';
  if(s!=='off'&&isNum(tg)) h+='<div class="tctl"><button class="mbtn" data-act="tdelta" data-d="-1">−</button><div class="tv">'+fmt(tg)+'°</div><button class="mbtn" data-act="tdelta" data-d="1">+</button></div>';
  h+='<div class="mbtns"><button class="mbtn go" data-act="mcancel">Cerrar</button></div>';
  document.getElementById('mbox').innerHTML=h;
}

/* ===== Acciones ===== */
function call(domain,service,data,entity){
  if(!connected){ toast('Sin conexión con Home Assistant'); return; }
  var m={type:'call_service',domain:domain,service:service,service_data:data||{}};
  if(entity) m.target={entity_id:entity};
  send(m,function(r){ if(!r.success) toast('Error: '+((r.error&&r.error.message)||'no se pudo ejecutar')); });
}
document.addEventListener('click',function(e){
  var el=e.target; while(el&&el!==document&&!(el.getAttribute&&el.getAttribute('data-act'))) el=el.parentNode;
  if(!el||el===document) return;
  resetIdle();
  var act=el.getAttribute('data-act'), ent=el.getAttribute('data-ent');
  if(act==='goto') goto(parseInt(el.getAttribute('data-n'),10));
  else if(act==='toggle'){ if(bad(st(ent))) return toast('Dispositivo no disponible'); call(ent.split('.')[0],'toggle',{},ent); }
  else if(act==='script'){ var ask=el.getAttribute('data-ask'), nm=el.getAttribute('data-name');
    var run=function(){ call('script','turn_on',{},ent); toast(nm+': orden enviada'); };
    if(ask) confirmBox(nm,ask,'Ejecutar',run); else run(); }
  else if(act==='alarm'){ var svc=el.getAttribute('data-svc'), nm2=el.getAttribute('data-name');
    confirmBox('Alarma: '+nm2,'¿Cambiar la alarma a "'+nm2+'"? Puede tardar unos minutos en confirmarse.','Confirmar',function(){ call('alarm_control_panel',svc,{},E.alarm); toast('Alarma: orden enviada'); }); }
  else if(act==='climate'){ if(bad(st(ent))) return toast('Aire no disponible'); openModal('', 'climate', ent); renderClimateModal(); }
  else if(act==='hvac'){ call('climate','set_hvac_mode',{hvac_mode:el.getAttribute('data-mode')},modalCtx); }
  else if(act==='tdelta'){ var id=modalCtx, step=parseFloat(at(id,'target_temp_step'))||1, t=parseFloat(at(id,'temperature')), mn=parseFloat(at(id,'min_temp'))||16, mx=parseFloat(at(id,'max_temp'))||30;
    var nt=Math.max(mn,Math.min(mx,t+parseFloat(el.getAttribute('data-d'))*step)); call('climate','set_temperature',{temperature:nt},id); }
  else if(act==='mcancel') closeModal();
  else if(act==='mok'){ var f=modalCtx; closeModal(); if(f) f(); }
});

/* ===== Conexión con Home Assistant (usa la sesión ya iniciada en este navegador) ===== */
var ws=null, msgId=0, pending={}, subId=0, retryT=null, lastMsg=0, offT=null;
function getTokens(){ try{ return JSON.parse(localStorage.getItem('hassTokens')); }catch(e){ return null; } }
function freshToken(cb){
  var t=getTokens();
  if(!t||!t.access_token){ cb(null,'auth'); return; }
  if(Date.now()<(t.expires||0)-15000){ cb(t); return; }
  var body='client_id='+encodeURIComponent(t.clientId)+'&grant_type=refresh_token&refresh_token='+encodeURIComponent(t.refresh_token);
  fetch(location.origin+'/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.access_token){ t.access_token=j.access_token; t.expires=Date.now()+(j.expires_in||1800)*1000; t.expires_in=j.expires_in; try{localStorage.setItem('hassTokens',JSON.stringify(t));}catch(e){} cb(t); }
      else cb(null,'auth');
    }).catch(function(){ cb(null,'net'); });
}
function send(m,cb){ m.id=++msgId; if(cb) pending[m.id]=cb; try{ ws.send(JSON.stringify(m)); }catch(e){} return m.id; }
function showOver(h){ var o=document.getElementById('over'); o.innerHTML=h; o.className='show'; }
function hideOver(){ document.getElementById('over').className=''; }
function showAuth(){ showOver('<h2>Falta iniciar sesión</h2><p>Abre Home Assistant una vez en este navegador e inicia sesión con el usuario de la tablet. Después vuelve a esta página.</p><a href="/">Abrir Home Assistant</a>'); }
function retry(){ setConn(false); if(retryT) clearTimeout(retryT); retryT=setTimeout(connect,5000); }
function setConn(ok){
  connected=ok; document.getElementById('dot').className=ok?'':'off';
  if(ok){ if(offT){clearTimeout(offT);offT=null;} hideOver(); }
  else if(!offT){ offT=setTimeout(function(){ if(!connected) showOver('<h2>Sin conexión con Home Assistant</h2><p>Reintentando automáticamente…</p>'); },12000); }
}
function loadForecast(){
  if(!connected) return;
  send({type:'call_service',domain:'weather',service:'get_forecasts',service_data:{type:'daily'},target:{entity_id:E.weather},return_response:true},function(r){
    try{ var f=r.result.response[E.weather].forecast; if(f&&f.length){ forecast=f; schedule(); } }catch(e){}
  });
}
function loadHourly(){
  if(!connected) return;
  send({type:'call_service',domain:'weather',service:'get_forecasts',service_data:{type:'hourly'},target:{entity_id:E.weather},return_response:true},function(r){
    try{ var f=r.result.response[E.weather].forecast; if(f&&f.length){ hourly=f; hourlyErr=false; schedule(); } else { hourlyErr=true; schedule(); } }catch(e){ hourlyErr=true; schedule(); }
  });
}
function applyEvent(ev){
  var id,x;
  if(ev.a){ for(id in ev.a){ x=ev.a[id]; S[id]={s:x.s,a:x.a||{}}; } }
  if(ev.c){ for(id in ev.c){ var d=ev.c[id], cur=S[id]||(S[id]={s:undefined,a:{}}), p=d['+'], m=d['-'];
    if(p){ if(p.s!==undefined) cur.s=p.s; if(p.a) cur.a=Object.assign({},cur.a,p.a); }
    if(m&&m.a){ var a2=Object.assign({},cur.a); m.a.forEach(function(k){delete a2[k];}); cur.a=a2; } } }
  if(ev.r){ ev.r.forEach(function(i){delete S[i];}); }
  schedule();
}
function connect(){
  freshToken(function(t,err){
    if(!t){ if(err==='net') retry(); else showAuth(); return; }
    var sock; try{ sock=new WebSocket(location.origin.replace(/^http/,'ws')+'/api/websocket'); }catch(e){ retry(); return; }
    ws=sock; pending={};
    sock.onmessage=function(ev){
      lastMsg=Date.now(); var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.type==='auth_required') sock.send(JSON.stringify({type:'auth',access_token:t.access_token}));
      else if(m.type==='auth_ok'){ setConn(true); subId=send({type:'subscribe_entities',entity_ids:WATCH}); loadForecast(); loadHourly(); }
      else if(m.type==='auth_invalid'){ showAuth(); }
      else if(m.type==='event'&&m.id===subId) applyEvent(m.event);
      else if(m.type==='result'&&pending[m.id]){ var cb=pending[m.id]; delete pending[m.id]; cb(m); }
    };
    sock.onclose=function(){ if(ws===sock) retry(); };
    sock.onerror=function(){ try{sock.close();}catch(e){} };
  });
}
setInterval(function(){ if(connected){ if(Date.now()-lastMsg>75000){ try{ws.close();}catch(e){} } else send({type:'ping'}); } },30000);
setInterval(loadForecast,30*60*1000); setInterval(loadHourly,15*60*1000);
setInterval(function(){ last.clock=null; setHTML('clock',headerClock()); },5000);

/* ===== Escalado a la pantalla ===== */
var scale=1;
function fit(){
  var w=window.innerWidth,h=window.innerHeight; scale=Math.min(w/1280,h/800);
  var st_=document.getElementById('stage'); st_.style.transform='translate('+Math.round((w-1280*scale)/2)+'px,'+Math.round((h-800*scale)/2)+'px) scale('+scale+')';
}
window.addEventListener('resize',fit); fit();
render(); goto(0); connect(); loadFacturas(); setInterval(loadFacturas,6*3600*1000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&!connected){ connect(); } });
})();
</script>
