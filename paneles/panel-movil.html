<style>
:root{
  --text:#eaf0ff; --muted:#a9b8d9; --green:#7ee2a8; --blue:#6aa8ff; --amber:#f5c26b; --red:#ff7a7a;
  --card:rgba(255,255,255,0.06); --line:rgba(255,255,255,0.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1330;color:var(--text);font-family:'Outfit',Roboto,'Segoe UI',Arial,sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;text-align:left}
svg.m{fill:currentColor;stroke:none}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#0a1330 0%,#10224a 55%,#0d1b3d 100%);padding-top:env(safe-area-inset-top)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.muted{color:var(--muted)}
/* cabecera */
#top{flex:none;padding:12px 16px 6px}
#clock{display:flex;justify-content:space-between;align-items:center}
#clock .t{font-size:44px;font-weight:300;line-height:1;letter-spacing:-1px}
#clock .d{font-size:15px;color:var(--muted);margin-top:2px}
.pill{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.08);font-size:13px}
.pill.ok{color:var(--green)} .pill.warn{color:var(--amber)} .pill.bad{color:var(--red)}
#people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0}
.avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;flex:none}
.chip .n{font-size:14px;font-weight:500;line-height:1.1} .chip .s{font-size:12px;color:var(--muted);white-space:nowrap} .chip .s.on{color:var(--green)}
/* vistas */
#views{flex:1;min-height:0;overflow:hidden;position:relative}
#track{display:flex;width:500%;height:100%;transition:transform .3s ease}
.screen{width:20%;height:100%;overflow-y:auto;overflow-x:hidden;padding:8px 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen>*{margin-bottom:12px}
.ct{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;margin-bottom:10px}
.lbl{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:1/3}
/* navegación */
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(8,16,40,0.9);border-top:1px solid var(--line)}
.navb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;border:1px solid transparent;font-size:11px;color:var(--muted);padding:6px 0;min-width:0}
.navb.act{background:rgba(106,168,255,0.14);border-color:rgba(106,168,255,0.5);color:var(--text)}
/* tiempo */
.now{display:flex;align-items:center;gap:14px}
.now .temp{font-size:56px;font-weight:300;line-height:1;letter-spacing:-2px}
.now .cond{font-size:18px} .now .mm{font-size:13px;color:var(--muted);margin-top:4px}
.stat{padding:12px 14px}
.stat .top{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stat .v{font-size:28px;font-weight:300;line-height:1.1;margin-top:6px}
.stat .v.sm{font-size:21px;white-space:nowrap}
.stat .v small{font-size:14px;color:var(--muted);margin-left:3px}
.stat .sub{font-size:12px;color:var(--muted);min-height:15px;margin-top:2px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.hr{flex:none;min-width:62px;background:rgba(255,255,255,0.05);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}
.hr .hn{font-size:12px;color:var(--muted)} .hr .ht{font-size:17px} .hr .hp{font-size:11px;color:var(--blue);min-height:13px}
.drow{display:grid;grid-template-columns:62px 40px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .dn{font-size:15px} .drow .tt{font-size:17px;text-align:right} .drow .tt span{color:var(--muted)}
.drow .pr{font-size:12px;color:var(--blue);text-align:right;min-width:64px}
/* casa */
.tile{border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:84px;color:var(--text)}
.tile:active{background:rgba(255,255,255,0.16)}
.tile .nm{font-size:16px;font-weight:500} .tile .stt{font-size:13px;color:var(--muted)}
.tile.on{background:rgba(245,194,107,0.14);border-color:rgba(245,194,107,0.6)} .tile.on .stt{color:var(--amber)}
.tile.cool{background:rgba(106,168,255,0.16);border-color:rgba(106,168,255,0.6)}
.tile.heat{background:rgba(255,140,90,0.16);border-color:rgba(255,140,90,0.6)}
.tile.na{opacity:.45}
.trow{display:flex;justify-content:space-between;align-items:flex-start}
.trow .big{font-size:24px;font-weight:300}
.routine{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:64px;padding:10px 14px}
.routine .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;flex:none}
.routine .nm{font-size:17px;font-weight:500} .routine .stt{font-size:12.5px;color:var(--muted);margin-top:1px}
.routine.run{border-color:var(--blue);background:rgba(106,168,255,0.14)}
.stack{display:flex;flex-direction:column;gap:10px}
/* seguridad */
.abtn{border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:88px}
.abtn:active{background:rgba(255,255,255,0.16)}
.abtn .nm{font-size:17px;font-weight:500} .abtn .stt{font-size:12.5px;color:var(--muted)}
.abtn.cur{background:rgba(126,226,168,0.13);border-color:rgba(126,226,168,0.6)}
.cam{display:flex;align-items:center;gap:14px}
.cam .ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(126,226,168,0.14);color:var(--green);flex:none}
.cam.alert .ic{background:rgba(255,122,122,0.18);color:var(--red)}
.cam .big{font-size:19px;font-weight:500}
.det{border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:92px}
.det .nm{font-size:16px;font-weight:500} .det .stt{font-size:13px;color:var(--muted)}
.det.ok{background:rgba(126,226,168,0.12);border-color:rgba(126,226,168,0.55)} .det.ok .stt{color:var(--green)}
.det.alert{background:rgba(255,122,122,0.22);border-color:var(--red)} .det.alert .stt{color:var(--red);font-weight:500}
.det.pend{opacity:.5;border-style:dashed}
.det.na{background:rgba(245,194,107,0.12);border-color:rgba(245,194,107,0.55)} .det.na .stt{color:var(--amber)}
#alertbar{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;display:none;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#2a0a0a;font-size:18px;font-weight:600;z-index:35;text-align:center}
#alertbar.show{display:flex}
/* energia */
.chart{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;height:196px;padding-top:4px}
.bcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.bval{font-size:10.5px;color:var(--text)}
.bars{width:100%;max-width:26px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px;overflow:hidden}
.seg{width:100%}
.seg.car{background:#f5a25b} .seg.pay{background:#6aa8ff} .seg.sun{background:#7ee2a8} .seg.raw{background:#8da2cf} .seg.cur{background:#8da2cf;opacity:.5}
.blab{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bignum{font-size:36px;font-weight:300;line-height:1.1}
.bignum small{font-size:16px;color:var(--muted);margin-left:4px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--muted);font-size:13.5px}
.kv span:last-child{text-align:right}
.kv .g{color:var(--green)}
.note{font-size:12px;color:var(--muted);line-height:1.35;margin-top:6px}
/* musica */
.mpick{display:flex;gap:8px;flex-wrap:wrap}
.mchip{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid var(--line);font-size:14px}
.mchip.cur{background:rgba(106,168,255,0.22);border-color:rgba(106,168,255,0.65)}
.mcover{width:100%;max-width:300px;aspect-ratio:1/1;margin:4px auto 14px;border-radius:20px;overflow:hidden;background:rgba(255,255,255,0.07);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mcover img{width:100%;height:100%;object-fit:cover;display:block}
.mtitle{font-size:21px;font-weight:500;line-height:1.2;text-align:center;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.martist{font-size:15px;color:var(--muted);text-align:center;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mprog{margin-top:16px}
.mbar{height:6px;border-radius:3px;background:rgba(255,255,255,0.12);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--blue);border-radius:3px;width:0}
.mtimes{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.mctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:10px}
.mb{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.09);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.mb:active{background:rgba(255,255,255,0.2)}
.mb.big{width:76px;height:76px;background:rgba(106,168,255,0.26);border-color:rgba(106,168,255,0.7)}
.mvol{display:flex;align-items:center;gap:12px;margin-top:18px}
.mvol .mb{width:46px;height:46px}
.mvol .vb{flex:1}
.mvol .vt{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.mfoot{display:flex;justify-content:center;margin-top:14px}
.mfav{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid var(--line);font-size:14px}
.mfav:active{background:rgba(255,255,255,0.2)}
.mempty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 8px;text-align:center}
.mempty .big{font-size:18px;font-weight:500}
/* modal, toast, avisos */
#modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,10,25,0.75);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.show{display:flex}
#mbox{width:100%;max-width:420px;padding:22px;background:#14264f;border:1px solid rgba(255,255,255,0.16);border-radius:22px}
#mbox h2{margin:0 0 8px;font-size:22px;font-weight:500}
#mbox p{margin:0 0 18px;font-size:15px;color:var(--muted);line-height:1.4}
.mbtns{display:flex;gap:12px}
.mbtn{flex:1;text-align:center;padding:14px;border-radius:14px;background:rgba(255,255,255,0.1);font-size:17px;font-weight:500}
.mbtn.go{background:rgba(106,168,255,0.28);border:1px solid rgba(106,168,255,0.7)}
.mbtn:active{background:rgba(255,255,255,0.22)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.modes .mbtn.cur{background:rgba(106,168,255,0.28);border:1px solid rgba(106,168,255,0.7)}
.tctl{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.tctl .mbtn{flex:none;width:80px;font-size:28px;padding:8px}
.tctl .tv{font-size:50px;font-weight:300}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,38,79,0.96);border:1px solid rgba(255,255,255,0.18);padding:12px 18px;border-radius:999px;font-size:14px;display:none;z-index:30;max-width:90%;text-align:center}
#dot{position:fixed;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--green);z-index:15;opacity:0}
#dot.off{opacity:1;background:var(--red)}
#over{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(5,10,25,0.92);z-index:40;text-align:center;padding:24px}
#over.show{display:flex}
#over h2{margin:0;font-size:24px;font-weight:500}
#over p{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
#over a{display:inline-block;margin-top:6px;padding:14px 22px;border-radius:14px;background:rgba(106,168,255,0.28);border:1px solid rgba(106,168,255,0.7);color:var(--text);font-size:17px;text-decoration:none}
</style>

function ic(n,s,c){ return '<svg class="m" width="'+s+'" height="'+s+'" viewBox="0 0 24 24"'+(c?' style="color:'+c+'"':'')+'>'+'<path d="'+P[n]+'"/></svg>'; }

function alIcon(){ var a=String(st(E.alarm)); return a==='disarmed'?'shieldopen':(a.indexOf('armed')===0?'shieldlock':'shield'); }
function wicon(cond,s){
  var sun='<circle cx="12" cy="12" r="4" fill="#f5c26b" stroke="#f5c26b"/><path stroke="#f5c26b" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/>';
  var cloud='<path stroke="#cfd9f2" d="M7 19a4 4 0 0 1-.5-8A5.500 5.500 0 0 1 17 12.500 3.300 3.300 0 0 1 17 19z"/>';
  var cl2='<path stroke="#cfd9f2" d="M7 16a4 4 0 0 1-.5-8A5.500 5.500 0 0 1 17 9.500 3.300 3.300 0 0 1 17 16z"/>';
  var g;
  switch(cond){
   case 'sunny': g=sun; break;
   case 'clear-night': g='<path stroke="#cfd9f2" d="M20 14.500A8.500 8.500 0 0 1 9.500 4a8.500 8.500 0 1 0 10.500 10.500z"/>'; break;
   case 'partlycloudy': g='<g transform="translate(3,-1) scale(.62)">'+sun+'</g><g transform="translate(0.5,2) scale(.85)">'+cloud+'</g>'; break;
   case 'cloudy': g=cloud; break;
   case 'rainy': g=cl2+'<path stroke="#6aa8ff" d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/>'; break;
   case 'pouring': g=cl2+'<path stroke="#6aa8ff" d="M8 18l-1.500 3.500M12 18l-1.500 3.500M16 18l-1.500 3.500"/>'; break;
   case 'snowy': case 'snowy-rainy': case 'hail': g=cl2+'<path stroke="#bcd7ff" d="M8 19h.01M12 20h.01M16 19h.01M10 22h.01M14 22h.01"/>'; break;
   case 'lightning': case 'lightning-rainy': g=cl2+'<path stroke="#f5c26b" d="M12 15l-2 3h3l-2 3"/>'; break;
   case 'fog': g='<path stroke="#cfd9f2" d="M4 9h16M3 13h18M5 17h14"/>'; break;
   case 'windy': case 'windy-variant': g='<path stroke="#cfd9f2" d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/>'; break;
   default: g=cloud;
  }
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24">'+g+'</svg>';
}
var COND={'sunny':'Soleado','clear-night':'Despejado','partlycloudy':'Poco nuboso','cloudy':'Nublado','rainy':'Lluvioso','pouring':'Lluvia fuerte',

var S={}, forecast=null, hourly=null, hourlyErr=false, screen=0, connected=false, idleT=null, mpSel=0;
function st(id){return S[id]?S[id].s:undefined;}
function at(id,k){var e=S[id];return e&&e.a?e.a[k]:undefined;}
function isNum(v){return v!==undefined&&v!==null&&v!==''&&v!=='unknown'&&v!=='unavailable'&&!isNaN(parseFloat(v));}
function fmt(v,d){ if(!isNum(v)) return 'sin datos'; var n=parseFloat(v); return (d===undefined?(Math.round(n*10)/10):n.toFixed(d)).toString().replace('.',','); }
function val(id,d){ var s=st(id); if(!isNum(s)) return 'sin datos'; var u=(at(id,'unit_of_measurement')||'').replace('EUR','€'); return fmt(s,d)+(u?' '+u:''); }
function pad(n){return n<10?'0'+n:''+n;}
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], DC=['dom','lun','mar','mié','jue','vie','sáb'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function hhmm(iso){ if(!iso) return '--:--'; var d=new Date(iso); if(isNaN(d.getTime())) return '--:--'; return pad(d.getHours())+':'+pad(d.getMinutes()); }
function cardinal(b){ if(!isNum(b)) return (typeof b==='string'&&b)?b:''; var a=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO']; return a[Math.round(parseFloat(b)/22.5)%16]; }
function bad(s){return s===undefined||s==='unavailable'||s==='unknown';}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var n=new Date(), a=ALM[st(E.alarm)]||['sin datos','warn'];

    '<button class="pill '+a[1]+'" data-act="goto" data-n="2">'+ic(alIcon(),18)+'<span>'+a[0]+'</span></button>';
}

function headerPeople(){

function headerNav(){

function stat(icon,label,value,sub,small,cls){

function hoursHtml(n,sz){
  if(!hourly||!hourly.length) return '<div class="lbl" style="padding:8px 0">'+(hourlyErr?'Previsión por horas no disponible':'Cargando previsión…')+'</div>';
  var now=Date.now(), list=hourly.filter(function(x){return new Date(x.datetime).getTime()>now-3600000;}).slice(0,n), h='';
  list.forEach(function(x,i){
    var dt=new Date(x.datetime), pp=x.precipitation_probability;
    h+='<div class="hr"><div class="hn">'+(i===0?'Ahora':pad(dt.getHours())+':00')+'</div>'+wicon(x.condition,sz)+'<div class="ht">'+fmt(x.temperature,0)+'°</div><div class="hp">'+(isNum(pp)&&pp>0?fmt(pp,0)+' %':'&nbsp;')+'</div></div>';
  });
  return h;
}
function outInfo(){
  var t=st(E.outTemp), hu=st(E.outHum), b=st(E.outBat), r={t:isNum(t)?parseFloat(t):null, h:isNum(hu)?parseFloat(hu):null, bat:'', low:false};
  if(!bad(b)){ var bl=String(b).toLowerCase(); r.low=(bl==='low'||(isNum(b)&&parseFloat(b)<=20)); r.bat=(BAT[bl]||(isNum(b)?fmt(b,0)+' %':b)); }
  return r;
}
function screen0(){

function chartData(){
  var now=new Date(), cur=monthKey(now), prev=monthKey(new Date(now.getFullYear(),now.getMonth()-1,1)), map={}, en=E.energy;
  FACT.forEach(function(f){ map[f.p]={p:f.p,pay:f.facturado,sun:Math.max(0,f.medido-f.facturado),tipo:'fact'}; });
  var mA=st(en.mesAnt), m0=st(en.mes);

/* ===== Acciones ===== */
function call(domain,service,data,entity){
  if(!connected){ toast('Sin conexión con Home Assistant'); return; }
  var m={type:'call_service',domain:domain,service:service,service_data:data||{}};
  if(entity) m.target={entity_id:entity};
  send(m,function(r){ if(!r.success) toast('Error: '+((r.error&&r.error.message)||'no se pudo ejecutar')); });
}
document.addEventListener('click',function(e){
  var el=e.target; while(el&&el!==document&&!(el.getAttribute&&el.getAttribute('data-act'))) el=el.parentNode;
  if(!el||el===document) return;
  resetIdle();
  var act=el.getAttribute('data-act'), ent=el.getAttribute('data-ent');
  if(act==='goto') goto(parseInt(el.getAttribute('data-n'),10));
  else if(act==='toggle'){ if(bad(st(ent))) return toast('Dispositivo no disponible'); call(ent.split('.')[0],'toggle',{},ent); }
  else if(act==='script'){ var ask=el.getAttribute('data-ask'), nm=el.getAttribute('data-name');
    var run=function(){ call('script','turn_on',{},ent); toast(nm+': orden enviada'); };
    if(ask) confirmBox(nm,ask,'Ejecutar',run); else run(); }
  else if(act==='alarm'){ var svc=el.getAttribute('data-svc'), nm2=el.getAttribute('data-name');
    confirmBox('Alarma: '+nm2,'¿Cambiar la alarma a "'+nm2+'"? Puede tardar unos minutos en confirmarse.','Confirmar',function(){ call('alarm_control_panel',svc,{},E.alarm); toast('Alarma: orden enviada'); }); }
  else if(act==='climate'){ if(bad(st(ent))) return toast('Aire no disponible'); openModal('', 'climate', ent); renderClimateModal(); }
  else if(act==='hvac'){ call('climate','set_hvac_mode',{hvac_mode:el.getAttribute('data-mode')},modalCtx); }
  else if(act==='tdelta'){ var id=modalCtx, step=parseFloat(at(id,'target_temp_step'))||1, t=parseFloat(at(id,'temperature')), mn=parseFloat(at(id,'min_temp'))||16, mx=parseFloat(at(id,'max_temp'))||30;
    var nt=Math.max(mn,Math.min(mx,t+parseFloat(el.getAttribute('data-d'))*step)); call('climate','set_temperature',{temperature:nt},id); }
  else if(act==='mcancel') closeModal();
  else if(act==='mok'){ var f=modalCtx; closeModal(); if(f) f(); }
  else if(act==='mpick'){ mpSel=parseInt(el.getAttribute('data-i'),10)||0; last.sc4=null; schedule(); }
  else if(act==='mplay'){ call('media_player','media_play_pause',{},curPlayer()[1]); }
  else if(act==='mnext'){ call('media_player','media_next_track',{},curPlayer()[1]); }
  else if(act==='mprev'){ call('media_player','media_previous_track',{},curPlayer()[1]); }
  else if(act==='mvol'){ var pid=curPlayer()[1], v=parseFloat(at(pid,'volume_level')); if(isNaN(v)) return toast('Este reproductor no permite cambiar el volumen');
    call('media_player','volume_set',{volume_level:Math.max(0,Math.min(1,Math.round((v+parseFloat(el.getAttribute('data-d')))*100)/100))},pid); }
  else if(act==='mmute'){ var pid2=curPlayer()[1]; call('media_player','volume_mute',{is_volume_muted:at(pid2,'is_volume_muted')!==true},pid2); }
  else if(act==='mfav'){ call('button','press',{},ent); toast('Marcada como favorita'); }
});
/* ===== Conexión con Home Assistant (usa la sesión ya iniciada en este navegador) ===== */
var ws=null, msgId=0, pending={}, subId=0, retryT=null, lastMsg=0, offT=null;
function getTokens(){ try{ return JSON.parse(localStorage.getItem('hassTokens')); }catch(e){ return null; } }
function freshToken(cb){
  var t=getTokens();
  if(!t||!t.access_token){ cb(null,'auth'); return; }
  if(Date.now()<(t.expires||0)-15000){ cb(t); return; }
  var body='client_id='+encodeURIComponent(t.clientId)+'&grant_type=refresh_token&refresh_token='+encodeURIComponent(t.refresh_token);
  fetch(location.origin+'/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.access_token){ t.access_token=j.access_token; t.expires=Date.now()+(j.expires_in||1800)*1000; t.expires_in=j.expires_in; try{localStorage.setItem('hassTokens',JSON.stringify(t));}catch(e){} cb(t); }
      else cb(null,'auth');
    }).catch(function(){ cb(null,'net'); });
}
function send(m,cb){ m.id=++msgId; if(cb) pending[m.id]=cb; try{ ws.send(JSON.stringify(m)); }catch(e){} return m.id; }
function showOver(h){ var o=document.getElementById('over'); o.innerHTML=h; o.className='show'; }
function hideOver(){ document.getElementById('over').className=''; }
function showAuth(){ showOver('<h2>Falta iniciar sesión</h2><p>Abre Home Assistant una vez en este navegador e inicia sesión con el usuario de la tablet. Después vuelve a esta página.</p><a href="/">Abrir Home Assistant</a>'); }
function retry(){ setConn(false); if(retryT) clearTimeout(retryT); retryT=setTimeout(connect,5000); }
function setConn(ok){
  connected=ok; document.getElementById('dot').className=ok?'':'off';
  if(ok){ if(offT){clearTimeout(offT);offT=null;} hideOver(); }
  else if(!offT){ offT=setTimeout(function(){ if(!connected) showOver('<h2>Sin conexión con Home Assistant</h2><p>Reintentando automáticamente…</p>'); },12000); }
}
function loadForecast(){
  if(!connected) return;
  send({type:'call_service',domain:'weather',service:'get_forecasts',service_data:{type:'daily'},target:{entity_id:E.weather},return_response:true},function(r){
    try{ var f=r.result.response[E.weather].forecast; if(f&&f.length){ forecast=f; schedule(); } }catch(e){}
  });
}
function loadHourly(){
  if(!connected) return;
  send({type:'call_service',domain:'weather',service:'get_forecasts',service_data:{type:'hourly'},target:{entity_id:E.weather},return_response:true},function(r){
    try{ var f=r.result.response[E.weather].forecast; if(f&&f.length){ hourly=f; hourlyErr=false; schedule(); } else { hourlyErr=true; schedule(); } }catch(e){ hourlyErr=true; schedule(); }
  });
}
function applyEvent(ev){
  var id,x;
  if(ev.a){ for(id in ev.a){ x=ev.a[id]; S[id]={s:x.s,a:x.a||{}}; } }
  if(ev.c){ for(id in ev.c){ var d=ev.c[id], cur=S[id]||(S[id]={s:undefined,a:{}}), p=d['+'], m=d['-'];
    if(p){ if(p.s!==undefined) cur.s=p.s; if(p.a) cur.a=Object.assign({},cur.a,p.a); }
    if(m&&m.a){ var a2=Object.assign({},cur.a); m.a.forEach(function(k){delete a2[k];}); cur.a=a2; } } }
  if(ev.r){ ev.r.forEach(function(i){delete S[i];}); }
  schedule();
}
function connect(){
  freshToken(function(t,err){
    if(!t){ if(err==='net') retry(); else showAuth(); return; }
    var sock; try{ sock=new WebSocket(location.origin.replace(/^http/,'ws')+'/api/websocket'); }catch(e){ retry(); return; }
    ws=sock; pending={};
    sock.onmessage=function(ev){
      lastMsg=Date.now(); var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.type==='auth_required') sock.send(JSON.stringify({type:'auth',access_token:t.access_token}));
      else if(m.type==='auth_ok'){ setConn(true); subId=send({type:'subscribe_entities',entity_ids:WATCH}); loadForecast(); loadHourly(); }
      else if(m.type==='auth_invalid'){ showAuth(); }
      else if(m.type==='event'&&m.id===subId) applyEvent(m.event);
      else if(m.type==='result'&&pending[m.id]){ var cb=pending[m.id]; delete pending[m.id]; cb(m); }
    };
    sock.onclose=function(){ if(ws===sock) retry(); };
    sock.onerror=function(){ try{sock.close();}catch(e){} };
  });
}
setInterval(function(){ if(connected){ if(Date.now()-lastMsg>75000){ try{ws.close();}catch(e){} } else send({type:'ping'}); } },30000);
setInterval(loadForecast,30*60*1000); setInterval(loadHourly,15*60*1000);
setInterval(function(){ last.clock=null; setHTML('clock',headerClock()); },5000);
setInterval(tickMusic,1000);

render(); goto(0); connect(); loadFacturas(); setInterval(loadFacturas,6*3600*1000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&!connected){ connect(); } });

})();
